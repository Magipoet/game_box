<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    user-select: none;
}

.container {
    background: white;
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    max-width: 600px;
    width: 100%;
}

header {
    text-align: center;
    margin-bottom: 25px;
}

.header-title {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
}

.header-title h1 {
    font-size: 2.2rem;
    color: #333;
    text-align: center;
}

.header-buttons {
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    gap: 10px;
}

.icon-btn {
    width: 36px;
    height: 36px;
    border: 2px solid #43e97b;
    background: white;
    color: #43e97b;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    line-height: 1;
}

.icon-btn:hover {
    background: #43e97b;
    color: white;
    transform: scale(1.1);
}

.stats {
    display: flex;
    justify-content: center;
    gap: 30px;
    flex-wrap: wrap;
}

.stat-item {
    text-align: center;
}

.stat-item .label {
    display: block;
    color: #666;
    font-size: 14px;
    margin-bottom: 5px;
}

.stat-item .value {
    font-size: 24px;
    font-weight: bold;
    color: #333;
}

.game-wrapper {
    position: relative;
    margin: 25px auto;
    display: flex;
    justify-content: center;
}

canvas {
    border: 4px solid #43e97b;
    border-radius: 12px;
    background: #1a1a2e;
    display: block;
    max-width: 100%;
    height: auto;
    touch-action: none;
}

.overlay {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 400px;
    height: 100%;
    background: rgba(26, 26, 46, 0.92);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    border: 4px solid #43e97b;
}

.overlay.hidden {
    display: none;
}

.overlay h2 {
    color: white;
    font-size: 2rem;
    margin-bottom: 15px;
}

.overlay p {
    color: rgba(255, 255, 255, 0.9);
    font-size: 1.1rem;
    margin-bottom: 10px;
}

.overlay .final-score {
    color: #43e97b;
    font-size: 1.5rem;
    font-weight: bold;
    margin: 15px 0;
}

.overlay .new-record {
    color: #ffc107;
    font-weight: bold;
    font-size: 1.2rem;
    margin-bottom: 10px;
    animation: pulse 1s infinite;
}

@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
}

.overlay-buttons {
    display: flex;
    gap: 15px;
    margin-top: 20px;
    flex-wrap: wrap;
    justify-content: center;
}

.btn {
    padding: 12px 30px;
    background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
    color: #333;
    border: none;
    border-radius: 30px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.3s, box-shadow 0.3s;
}

.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(67, 233, 123, 0.4);
}

.btn-secondary {
    background: linear-gradient(135deg, #6c757d 0%, #5a6268 100%);
    color: white;
}

.btn-secondary:hover {
    box-shadow: 0 8px 20px rgba(108, 117, 125, 0.4);
}

footer {
    text-align: center;
    margin-top: 20px;
}

.controls-hint {
    color: #666;
    font-size: 13px;
    margin-top: 15px;
    text-align: center;
}

.controls-hint kbd {
    background: #f0f0f0;
    border: 1px solid #ccc;
    border-radius: 4px;
    padding: 2px 8px;
    font-size: 12px;
    font-family: monospace;
    margin: 0 2px;
}

.mobile-controls {
    display: none;
    margin-top: 20px;
    justify-content: center;
    gap: 10px;
}

.mobile-btn {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: 3px solid #43e97b;
    background: white;
    color: #43e97b;
    font-size: 24px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
}

.mobile-btn:active {
    background: #43e97b;
    color: white;
    transform: scale(0.95);
}

@media (max-width: 600px) {
    .mobile-controls {
        display: flex;
        flex-wrap: wrap;
        max-width: 300px;
        margin-left: auto;
        margin-right: auto;
    }
    .controls-hint {
        display: none;
    }
}
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-title">
                <h1>🐍 贪吃蛇</h1>
                <div class="header-buttons">
                    <button id="sound-btn" class="icon-btn" title="音效开关">🔊</button>
                    <button id="pause-btn" class="icon-btn" title="暂停">⏸</button>
                </div>
            </div>
            <div class="stats">
                <div class="stat-item">
                    <span class="label">分数:</span>
                    <span id="score" class="value">0</span>
                </div>
                <div class="stat-item">
                    <span class="label">最高分:</span>
                    <span id="high-score" class="value">0</span>
                </div>
                <div class="stat-item">
                    <span class="label">长度:</span>
                    <span id="length" class="value">3</span>
                </div>
            </div>
        </header>

        <main>
            <div class="game-wrapper">
                <canvas id="game-canvas" width="400" height="400"></canvas>
                <div id="start-overlay" class="overlay">
                    <h2>🐍 贪吃蛇</h2>
                    <p>使用方向键或 WASD 控制蛇的移动</p>
                    <p>吃食物 🍎 增长身体，避免撞墙和撞到自己</p>
                    <div class="overlay-buttons">
                        <button id="start-btn" class="btn">开始游戏</button>
                    </div>
                </div>
                <div id="pause-overlay" class="overlay hidden">
                    <h2>⏸ 游戏暂停</h2>
                    <p>按空格键或点击继续</p>
                    <div class="overlay-buttons">
                        <button id="resume-btn" class="btn">继续游戏</button>
                    </div>
                </div>
                <div id="gameover-overlay" class="overlay hidden">
                    <h2>💀 游戏结束</h2>
                    <p id="new-record-text" class="new-record hidden">🏆 新纪录！</p>
                    <p>本局得分</p>
                    <div class="final-score" id="final-score">0</div>
                    <div class="overlay-buttons">
                        <button id="retry-btn" class="btn">🔄 再来一局</button>
                    </div>
                </div>
            </div>

            <div class="mobile-controls">
                <button class="mobile-btn" data-dir="up">▲</button>
                <button class="mobile-btn" data-dir="left">◀</button>
                <button class="mobile-btn" data-dir="down">▼</button>
                <button class="mobile-btn" data-dir="right">▶</button>
            </div>

            <p class="controls-hint">⌨️ <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动 · <kbd>空格</kbd> 暂停</p>
        </main>
    </div>

    <script>
(function() {
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('high-score');
    const lengthEl = document.getElementById('length');
    const finalScoreEl = document.getElementById('final-score');
    const newRecordText = document.getElementById('new-record-text');
    const soundBtn = document.getElementById('sound-btn');
    const pauseBtn = document.getElementById('pause-btn');

    const startOverlay = document.getElementById('start-overlay');
    const pauseOverlay = document.getElementById('pause-overlay');
    const gameoverOverlay = document.getElementById('gameover-overlay');

    const startBtn = document.getElementById('start-btn');
    const resumeBtn = document.getElementById('resume-btn');
    const retryBtn = document.getElementById('retry-btn');

    const GRID_SIZE = 20;
    const CELL_SIZE = canvas.width / GRID_SIZE;

    let snake, direction, nextDirection, food, score, gameLoop, gameSpeed, isPaused, isRunning;
    let highScore = parseInt(localStorage.getItem('snakeHighScore') || '0');
    let soundEnabled = localStorage.getItem('snakeSound') !== 'false';
    let audioCtx = null;

    highScoreEl.textContent = highScore;
    soundBtn.textContent = soundEnabled ? '🔊' : '🔇';

    function ensureAudio() {
        if (!audioCtx) {
            try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
    }

    function playSound(type) {
        if (!soundEnabled) return;
        const ctx = ensureAudio();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        let freq = 440, duration = 0.1, volume = 0.15, wave = 'sine';
        switch(type) {
            case 'eat': freq = 800; duration = 0.1; volume = 0.2; wave = 'square'; break;
            case 'gameover': freq = 150; duration = 0.4; volume = 0.25; wave = 'sawtooth'; break;
            case 'click': freq = 600; duration = 0.05; volume = 0.1; wave = 'square'; break;
        }
        osc.type = wave;
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(volume, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
        osc.start(now);
        osc.stop(now + duration);
    }

    function init() {
        snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
        direction = {x: 1, y: 0};
        nextDirection = {x: 1, y: 0};
        score = 0;
        gameSpeed = 120;
        isPaused = false;
        isRunning = false;
        placeFood();
        updateStats();
        draw();
    }

    function placeFood() {
        let valid = false;
        while (!valid) {
            food = {
                x: Math.floor(Math.random() * GRID_SIZE),
                y: Math.floor(Math.random() * GRID_SIZE)
            };
            valid = !snake.some(s => s.x === food.x && s.y === food.y);
        }
    }

    function updateStats() {
        scoreEl.textContent = score;
        lengthEl.textContent = snake.length;
    }

    function draw() {
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = 'rgba(255,255,255,0.03)';
        ctx.lineWidth = 1;
        for (let i = 0; i <= GRID_SIZE; i++) {
            ctx.beginPath();
            ctx.moveTo(i * CELL_SIZE, 0);
            ctx.lineTo(i * CELL_SIZE, canvas.height);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, i * CELL_SIZE);
            ctx.lineTo(canvas.width, i * CELL_SIZE);
            ctx.stroke();
        }

        ctx.fillStyle = '#ff6b6b';
        ctx.beginPath();
        ctx.arc(food.x * CELL_SIZE + CELL_SIZE / 2, food.y * CELL_SIZE + CELL_SIZE / 2, CELL_SIZE / 2 - 2, 0, Math.PI * 2);
        ctx.fill();

        snake.forEach((seg, i) => {
            if (i === 0) {
                ctx.fillStyle = '#43e97b';
            } else {
                const t = i / snake.length;
                ctx.fillStyle = `rgb(${Math.floor(67 + t * 20)}, ${Math.floor(233 - t * 80)}, ${Math.floor(123 + t * 50)})`;
            }
            ctx.fillRect(seg.x * CELL_SIZE + 1, seg.y * CELL_SIZE + 1, CELL_SIZE - 2, CELL_SIZE - 2);
        });

        if (snake.length > 0) {
            const head = snake[0];
            ctx.fillStyle = '#1a1a2e';
            const eyeSize = CELL_SIZE / 6;
            const eyeOffset = CELL_SIZE / 4;
            if (direction.x === 1) {
                ctx.beginPath();
                ctx.arc(head.x * CELL_SIZE + CELL_SIZE - eyeOffset, head.y * CELL_SIZE + eyeOffset, eyeSize, 0, Math.PI * 2);
                ctx.arc(head.x * CELL_SIZE + CELL_SIZE - eyeOffset, head.y * CELL_SIZE + CELL_SIZE - eyeOffset, eyeSize, 0, Math.PI * 2);
                ctx.fill();
            } else if (direction.x === -1) {
                ctx.beginPath();
                ctx.arc(head.x * CELL_SIZE + eyeOffset, head.y * CELL_SIZE + eyeOffset, eyeSize, 0, Math.PI * 2);
                ctx.arc(head.x * CELL_SIZE + eyeOffset, head.y * CELL_SIZE + CELL_SIZE - eyeOffset, eyeSize, 0, Math.PI * 2);
                ctx.fill();
            } else if (direction.y === -1) {
                ctx.beginPath();
                ctx.arc(head.x * CELL_SIZE + eyeOffset, head.y * CELL_SIZE + eyeOffset, eyeSize, 0, Math.PI * 2);
                ctx.arc(head.x * CELL_SIZE + CELL_SIZE - eyeOffset, head.y * CELL_SIZE + eyeOffset, eyeSize, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.beginPath();
                ctx.arc(head.x * CELL_SIZE + eyeOffset, head.y * CELL_SIZE + CELL_SIZE - eyeOffset, eyeSize, 0, Math.PI * 2);
                ctx.arc(head.x * CELL_SIZE + CELL_SIZE - eyeOffset, head.y * CELL_SIZE + CELL_SIZE - eyeOffset, eyeSize, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    }

    function update() {
        if (isPaused || !isRunning) return;

        direction = { ...nextDirection };
        const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

        if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
            gameOver();
            return;
        }

        if (snake.some(s => s.x === head.x && s.y === head.y)) {
            gameOver();
            return;
        }

        snake.unshift(head);

        if (head.x === food.x && head.y === food.y) {
            score += 10;
            playSound('eat');
            placeFood();
            if (gameSpeed > 60) gameSpeed -= 2;
            clearInterval(gameLoop);
            gameLoop = setInterval(tick, gameSpeed);
        } else {
            snake.pop();
        }

        updateStats();
        draw();
    }

    function tick() {
        update();
    }

    function gameOver() {
        isRunning = false;
        clearInterval(gameLoop);
        playSound('gameover');
        const isNewRecord = score > highScore;
        if (isNewRecord) {
            highScore = score;
            localStorage.setItem('snakeHighScore', highScore);
            highScoreEl.textContent = highScore;
            newRecordText.classList.remove('hidden');
        } else {
            newRecordText.classList.add('hidden');
        }
        finalScoreEl.textContent = score;
        gameoverOverlay.classList.remove('hidden');
    }

    function startGame() {
        init();
        isRunning = true;
        startOverlay.classList.add('hidden');
        pauseOverlay.classList.add('hidden');
        gameoverOverlay.classList.add('hidden');
        clearInterval(gameLoop);
        gameLoop = setInterval(tick, gameSpeed);
    }

    function togglePause() {
        if (!isRunning) return;
        isPaused = !isPaused;
        if (isPaused) {
            pauseOverlay.classList.remove('hidden');
        } else {
            pauseOverlay.classList.add('hidden');
        }
    }

    function setDirection(dx, dy) {
        if (direction.x === -dx && direction.y === -dy) return;
        if (direction.x === dx && direction.y === dy) return;
        nextDirection = { x: dx, y: dy };
    }

    document.addEventListener('keydown', (e) => {
        switch(e.key) {
            case 'ArrowUp': case 'w': case 'W': e.preventDefault(); setDirection(0, -1); break;
            case 'ArrowDown': case 's': case 'S': e.preventDefault(); setDirection(0, 1); break;
            case 'ArrowLeft': case 'a': case 'A': e.preventDefault(); setDirection(-1, 0); break;
            case 'ArrowRight': case 'd': case 'D': e.preventDefault(); setDirection(1, 0); break;
            case ' ': e.preventDefault(); togglePause(); break;
        }
    });

    document.querySelectorAll('.mobile-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const dir = btn.dataset.dir;
            if (dir === 'up') setDirection(0, -1);
            else if (dir === 'down') setDirection(0, 1);
            else if (dir === 'left') setDirection(-1, 0);
            else if (dir === 'right') setDirection(1, 0);
        });
    });

    let touchStartX = 0, touchStartY = 0;
    canvas.addEventListener('touchstart', (e) => {
        const touch = e.touches[0];
        touchStartX = touch.clientX;
        touchStartY = touch.clientY;
    });
    canvas.addEventListener('touchend', (e) => {
        const touch = e.changedTouches[0];
        const dx = touch.clientX - touchStartX;
        const dy = touch.clientY - touchStartY;
        if (Math.abs(dx) > Math.abs(dy)) {
            setDirection(dx > 0 ? 1 : -1, 0);
        } else {
            setDirection(0, dy > 0 ? 1 : -1);
        }
    });

    startBtn.addEventListener('click', startGame);
    retryBtn.addEventListener('click', startGame);
    resumeBtn.addEventListener('click', togglePause);

    pauseBtn.addEventListener('click', togglePause);

    soundBtn.addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        localStorage.setItem('snakeSound', soundEnabled);
        soundBtn.textContent = soundEnabled ? '🔊' : '🔇';
        if (soundEnabled) playSound('click');
    });

    init();
})();
    </script>
</body>
</html>
